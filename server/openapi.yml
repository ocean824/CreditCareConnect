openapi: 3.0.3
info:
  title: Personal Credit Pros API
  version: 1.0.0
  description: >
    REST API for Personal Credit Pros. Real auth is Replit OIDC session-based; a test-only header auth exists when TEST_AUTH=1.
servers:
  - url: /
tags:
  - name: Public
  - name: Auth
  - name: User
  - name: Admin
  - name: CreditReports
  - name: Violations
  - name: DisputeLetters
  - name: Payments
  - name: Notifications
  - name: MailBatches
  - name: Observability
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        plan: { type: string, enum: [DIY, DONE_FOR_YOU, ENTERPRISE] }
        role: { type: string, enum: [user, admin] }
paths:
  /healthz:
    get:
      tags: [Observability]
      summary: Liveness
      responses:
        '200': { description: ok }
  /readyz:
    get:
      tags: [Observability]
      summary: Readiness (DB)
      responses:
        '200': { description: ready }
        '503': { description: not-ready }
  /api/auth/user:
    get:
      tags: [Auth]
      summary: Get current user (session)
      responses:
        '200': { description: Current user; may be null if anonymous }
  /api/me:
    get:
      tags: [User]
      summary: Get current user profile
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/credit-reports:
    get:
      tags: [CreditReports]
      summary: List credit reports (current user)
      responses:
        '200': { description: OK }
  /api/credit-reports/upload:
    post:
      tags: [CreditReports]
      summary: Upload credit report
      responses:
        '200': { description: Uploaded }
  /api/violations:
    get:
      tags: [Violations]
      summary: List violations for current user
      responses:
        '200': { description: OK }
  /api/dispute-letters:
    get:
      tags: [DisputeLetters]
      summary: List dispute letters
      responses:
        '200': { description: OK }
  /api/dispute-letters/generate:
    post:
      tags: [DisputeLetters]
      summary: Generate a dispute letter
      responses:
        '200': { description: OK }
  /api/freeze-opt-out:
    post:
      tags: [Public]
      summary: Freeze/Opt-out automation
      responses:
        '200': { description: OK }
  /api/admin/whoami:
    get:
      tags: [Admin]
      summary: Admin session debug
      responses:
        '200': { description: OK }
  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Admin stats
      responses:
        '200': { description: OK }
